wandb:
  entity: null
  resume: 'auto'

experiment:
    project: "showo2-7b-counting"
    name: "showo2-7b-counting"
    output_dir: "./checkpoints/showo2-7b-counting"
    output_dataloader_state_dir: "dataloader_states"
    max_train_examples_t2i: 100000000
    max_train_examples_mmu: 100000000
    save_every: 200  # 자주 저장하도록 조정 (필요시 변경)
    eval_every: 50
    generate_every: 500
    log_every: 1
    log_grad_norm_every: 100
    resume_from_checkpoint: false

model:
    vae_model:
        type: "wan21"
        pretrained_model_path: "Wan2.1_VAE.pth"

    showo:
        model_name: "Showo2"
        load_from_showo: True
        pretrained_model_path: "showlab/show-o2-7B"
        llm_model_path: "Qwen/Qwen2.5-7B-Instruct"
        llm_vocab_size: null
        hidden_size: 3584
        image_latent_dim: 16
        image_latent_height: 27
        image_latent_width: 27
        hq_image_latent_height: 64
        hq_image_latent_width: 64
        mixed_modal_latent_height: 27
        mixed_modal_latent_width: 27
        patch_size: 2
        num_diffusion_layers: 10
        clip_latent_dim: 1152
        add_qk_norm: True
        add_time_embeds: True
        # frozen_params: null
        frozen_params: ['image_embedder_und', 'und_trans', 'position_embedding', 'image_embedder_gen', 'diffusion', 'diff_proj', 'time_embed_proj', 'fusion_proj', 'lm_head',]
        params_not_load: null

    clip:
      pretrained_model_path: "google/siglip-so400m-patch14-384"

    gradient_checkpointing: false

dataset:
    samp_probs: null
    accumulation: 1
    mixed_loader_mode: "concat_max_size_cycle"
    params:
        # T2I path is kept for config compatibility but might not be used in counting training
        train_t2i_shards_path_or_url: "path/to/your.jsonl"
        # Main dataset for counting
        # train_mmu_shards_path_or_url: "Jiwon-Kang/pixmo-count-filtered-imgContained"
        train_mmu_shards_path_or_url: "/home/work/.project/jiwon/deepseek-janus-pro-lora/data/pixmo-points-filtered_0-20_imgContained"
        annotation_path: ""
        is_clip_encoder: False
        default_system_prompt: "system\nYou are a helpful assistant.<|im_end|>"
        add_caption_prompt: True
        validation_prompts_file: "prompts/t2i_prompts.txt"
        shuffle_buffer_size: 1000
        num_workers: 32
        pin_memory: True
        persistent_workers: True

    preprocessing:
        max_seq_length: 1024
        max_hq_seq_length: 1024 # 4352
        max_mixed_modal_seq_length: 1024 # 5120
        resolution: 432
        hq_resolution: 1024
        mixed_modal_resolution: 432
        num_t2i_image_tokens: 729
        num_mmu_image_tokens: 729
        num_hq_image_tokens: 4096
        num_mixed_modal_tokens: 729
        num_video_tokens: 3645
        latent_height: ${model.showo.image_latent_height}
        latent_width: ${model.showo.image_latent_width}
        hq_latent_height: ${model.showo.hq_image_latent_height}
        hq_latent_width: ${model.showo.hq_image_latent_width}
        mixed_modal_latent_height: ${model.showo.hq_image_latent_height}
        mixed_modal_latent_width: ${model.showo.hq_image_latent_width}
        min_res: [512, 512]
        random_und_or_gen: 0.0

optimizer:
    name: adamw
    params:
        learning_rate_overall: 0.00005
        learning_rate_ve: 0.00005
        learning_rate_proj: 0.00005
        learning_rate_showo: 0.00005
        scale_lr: False
        beta1: 0.9
        beta2: 0.999
        weight_decay: 0
        epsilon: 1e-8

lr_scheduler:
    scheduler: "cosine"
    params:
        warmup_steps: null
        warmup_ratio: 0.03

transport:
    path_type: "Linear"
    prediction: "velocity"
    loss_weight: null
    train_eps: null
    sample_eps: null
    snr_type: "lognorm"
    sampling_method: "euler"
    guidance_scale: 5.0
    num_inference_steps: 50
    atol: 1e-6
    rtol: 1e-3
    reverse: False
    do_shift: True
    time_shifting_factor: 3.0

training:
    gradient_accumulation_steps: 128
    batch_size_t2i: 1
    batch_size_mmu: 1 # Adjusted for H100
    mixed_precision: "bf16"
    enable_tf32: True
    seed: 1008
    max_train_steps: null # Set a reasonable limit or null
    # num_epochs: 10
    cond_dropout_prob: 0.1
    label_smoothing: 0.0
    max_grad_norm: 1.0
    ntp_coeff: 1.0
    flow_coeff: 1.0
    stage: "tuning"
    noise_und_image: True
    und_max_t0: 1.0
