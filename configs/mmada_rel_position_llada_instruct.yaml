wandb:
  entity: null
  resume: 'auto'

experiment:
    project: "mmada-rel-position"
    name: "mmada-rel-position-llada-instruct"
    output_dir: "mmada-rel-position-llada-instruct"
    max_train_examples_t2i: 40000000
    max_train_examples_mmu: 40000000
    save_every: 5000
    eval_every: 500
    generate_every: 1000
    log_every: 10
    log_grad_norm_every: 100
    resume_from_checkpoint: "latest"
    max_val_rel_position_samples: 100
    validate_before_train : False # True이면 훈련 시작 전 Validation 수행.

model:
    vq_model:
        type: "magvitv2"
        vq_model_name: "showlab/magvitv2"

    mmada:
        tokenizer_path: "GSAI-ML/LLaDA-8B-Instruct"
        pretrained_model_path: "Gen-Verse/MMaDA-8B-MixCoT"
        w_clip_vit: False
        new_vocab_size: 134656
        llm_vocab_size: 126464
        codebook_size: 8192
        num_vq_tokens: 1024
        num_new_special_tokens: 0
        tie_word_embeddings: False

    gradient_checkpointing: True

dataset:
    gen_type: "t2i"
    und_type: "rel_position"
    combined_loader_mode: "max_size_cycle"
    params:
        # RelPosition-only training: T2I/LM regularization disabled
        # (enable by re-adding T2I/LM paths and setting batch_size_t2i / batch_size_lm > 0)
        validation_prompts_file: "validation_prompts/text2image_prompts.txt"
        mmu_image_root: "./mmu_validation"
        shuffle_buffer_size: 1000
        num_workers: 16
        resolution: 512
        pin_memory: True
        persistent_workers: True

    preprocessing:
        max_seq_length: 128 # 이미지 제외, 최대 텍스트 인풋 길이 (prompt + target)
        resolution: 512
        center_crop: False
        random_flip: False

optimizer:
    name: adamw
    params:
        learning_rate: 2e-5
        scale_lr: False
        beta1: 0.9
        beta2: 0.999
        weight_decay: 0.01
        epsilon: 1e-8

lr_scheduler:
    scheduler: "cosine"
    params:
        learning_rate: ${optimizer.params.learning_rate}
        warmup_steps: 500
        min_lr_scale: 0.1

training:
    gradient_accumulation_steps: 2
    noise_type: "mask"
    batch_size_t2i: 0
    batch_size_lm: 0
    batch_size_mmu: 1
    mixed_precision: "bf16"
    enable_tf32: True
    seed: 10086
    max_train_steps: 50000
    overfit_one_batch: False
    cond_dropout_prob: 0.1
    min_masking_rate: 0.0
    label_smoothing: 0.0
    max_grad_norm: 1
    guidance_scale: 3
    generation_timesteps: 12
    # RelPosition-only: T2I/LM regularization disabled (coeff=0, batch_size=0).
    # To re-enable, set batch_size_t2i / batch_size_lm > 0 and tune coeffs.
    t2i_coeff: 0.0
    lm_coeff: 0.0
    mmu_coeff: 1.0

mask_schedule:
    schedule: "cosine"

lora:
    enable: True
    rank: 128
    alpha: 128
    dropout: 0.05
    target_modules: ["q_proj", "k_proj", "v_proj", "attn_out", "ff_proj", "up_proj"]
    bias: "none"
